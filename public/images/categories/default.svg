<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="defGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <radialGradient id="defGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="350" fill="url(#defGrad)" />
  <circle cx="300" cy="140" r="130" fill="url(#defGlow)" />
  <!-- Graduation Cap & Book -->
  <g fill="#ffffff" opacity="0.95" transform="translate(300, 140) scale(1.15)">
    <!-- Cap Diamond -->
    <polygon points="0,-45 60,-22 0,0 -60,-22" fill="#0f172a" stroke="#f8fafc" stroke-width="2.5" />
    <!-- Cap Base skull -->
    <path d="M-30 -11 L-30 15 C-30 25 30 25 30 15 L30 -11" fill="#1e293b" />
    <!-- Tassel -->
    <path d="M60 -22 L65 5 L68 12" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" fill="none" />
    <circle cx="68" cy="15" r="4" fill="#f59e0b" />
    <!-- Open Book below -->
    <path d="M0 26 L-45 35 L-45 60 L0 52 L45 60 L45 35 Z" fill="#ffffff" />
    <line x1="0" y1="26" x2="0" y2="52" stroke="#cbd5e1" stroke-width="2" />
  </g>
  <!-- Category Tag -->
  <g transform="translate(300, 280)">
    <rect x="-95" y="-16" width="190" height="32" rx="16" fill="#0c4a6e" fill-opacity="0.75" stroke="#bae6fd" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" fill="#f0f9ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">CERTIFIED COURSE</text>
  </g>
</svg>
