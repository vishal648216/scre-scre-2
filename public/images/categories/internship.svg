<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="internGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="350" fill="url(#internGrad)" />
  <circle cx="300" cy="140" r="130" fill="url(#goldGlow)" />
  <!-- Briefcase & Certificate Badge -->
  <g fill="#ffffff" opacity="0.9" transform="translate(300, 140) scale(1.15)">
    <!-- Briefcase Body -->
    <rect x="-55" y="-25" width="110" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <!-- Briefcase Handle -->
    <path d="M-22 -25 L-22 -42 C-22 -48 22 -48 22 -42 L22 -25" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" />
    <!-- Center lock / badge -->
    <circle cx="0" cy="10" r="14" fill="#eab308" stroke="#fef08a" stroke-width="2" />
    <!-- Star on badge -->
    <polygon points="0,3 4,14 14,14 6,20 9,30 0,24 -9,30 -6,20 -14,14 -4,14" fill="#ffffff" transform="translate(0, -6) scale(0.6)" />
    <!-- Straps -->
    <line x1="-30" y1="-25" x2="-30" y2="45" stroke="#475569" stroke-width="3" />
    <line x1="30" y1="-25" x2="30" y2="45" stroke="#475569" stroke-width="3" />
  </g>
  <!-- Category Tag -->
  <g transform="translate(300, 280)">
    <rect x="-115" y="-16" width="230" height="32" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" fill="#f0f9ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">PRACTICAL INTERNSHIP</text>
  </g>
</svg>
