<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="compGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="codeGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="350" fill="url(#compGrad)" />
  <circle cx="300" cy="140" r="130" fill="url(#codeGlow)" />
  <!-- Laptop & Tech Icon -->
  <g fill="#ffffff" transform="translate(300, 140)">
    <!-- Screen frame -->
    <rect x="-65" y="-50" width="130" height="85" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="3" />
    <!-- Screen display area -->
    <rect x="-56" y="-42" width="112" height="69" rx="3" fill="#0f172a" />
    <!-- Code brackets inside display -->
    <path d="M-25 -18 L-38 -7 L-25 4" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M25 -18 L38 -7 L25 4" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <path d="M-6 10 L6 -24" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" fill="none" />
    <!-- Laptop base -->
    <path d="M-82 35 L82 35 L72 45 L-72 45 Z" fill="#94a3b8" />
    <!-- Trackpad notch -->
    <rect x="-18" y="37" width="36" height="4" rx="2" fill="#cbd5e1" />
  </g>
  <!-- Category Tag -->
  <g transform="translate(300, 280)">
    <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#38bdf8" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" fill="#f0f9ff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">COMPUTER &amp; IT SKILLS</text>
  </g>
</svg>
