<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="fashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a044e" />
      <stop offset="50%" stop-color="#86198f" />
      <stop offset="100%" stop-color="#be185d" />
    </linearGradient>
    <radialGradient id="pinkGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="350" fill="url(#fashGrad)" />
  <circle cx="300" cy="140" r="130" fill="url(#pinkGlow)" />
  <!-- Dress Mannequin & Design Symbol -->
  <g fill="#ffffff" opacity="0.9" transform="translate(300, 140) scale(1.1)">
    <!-- Stand Neck & Head oval -->
    <ellipse cx="0" cy="-60" rx="10" ry="12" fill="#fbcfe8" />
    <rect x="-3" y="-50" width="6" height="12" fill="#fbcfe8" />
    <!-- Torso Dress -->
    <path d="M-22 -38 C-14 -35 14 -35 22 -38 C26 -20 22 0 16 10 C22 25 35 45 42 60 L-42 60 C-35 45 -22 25 -16 10 C-22 0 -26 -20 -22 -38 Z" fill="#fdf2f8" stroke="#f472b6" stroke-width="2" />
    <!-- Waist ribbon -->
    <path d="M-17 10 Q 0 15 17 10 L16 15 Q 0 20 -16 15 Z" fill="#db2777" />
    <!-- Stand Pole -->
    <rect x="-3" y="60" width="6" height="30" fill="#cbd5e1" />
    <!-- Stand Base -->
    <ellipse cx="0" cy="90" rx="28" ry="6" fill="#94a3b8" />
  </g>
  <!-- Category Tag -->
  <g transform="translate(300, 280)">
    <rect x="-115" y="-16" width="230" height="32" rx="16" fill="#4a044e" fill-opacity="0.75" stroke="#f472b6" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" fill="#fdf2f8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">FASHION &amp; TEXTILE DESIGN</text>
  </g>
</svg>
