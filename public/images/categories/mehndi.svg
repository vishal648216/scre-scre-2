<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="mehndiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="50%" stop-color="#881337" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <radialGradient id="hennaGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="350" fill="url(#mehndiGrad)" />
  <circle cx="300" cy="140" r="130" fill="url(#hennaGlow)" />
  <!-- Mandala / Mehndi Ornament -->
  <g stroke="#fef08a" stroke-width="2.5" fill="none" opacity="0.9" transform="translate(300, 140)">
    <circle cx="0" cy="0" r="15" fill="#fde047" fill-opacity="0.4" />
    <circle cx="0" cy="0" r="28" stroke-dasharray="4 4" />
    <circle cx="0" cy="0" r="45" />
    <circle cx="0" cy="0" r="62" stroke-dasharray="6 4" />
    <!-- 8 Petals -->
    <path d="M0 -28 C-8 -38 -8 -50 0 -58 C8 -50 8 -38 0 -28 Z" fill="#fde047" fill-opacity="0.3" />
    <path d="M0 28 C-8 38 -8 50 0 58 C8 50 8 38 0 28 Z" fill="#fde047" fill-opacity="0.3" />
    <path d="M-28 0 C-38 -8 -50 -8 -58 0 C-50 8 -38 8 -28 0 Z" fill="#fde047" fill-opacity="0.3" />
    <path d="M28 0 C38 -8 50 -8 58 0 C50 8 38 8 28 0 Z" fill="#fde047" fill-opacity="0.3" />
    <!-- Diagonal petals -->
    <path d="M-20 -20 C-30 -22 -38 -30 -40 -40 C-30 -38 -22 -30 -20 -20 Z" fill="#fde047" fill-opacity="0.2" />
    <path d="M20 -20 C30 -22 38 -30 40 -40 C30 -38 22 -30 20 -20 Z" fill="#fde047" fill-opacity="0.2" />
    <path d="M-20 20 C-30 22 -38 30 -40 40 C-30 38 -22 30 -20 20 Z" fill="#fde047" fill-opacity="0.2" />
    <path d="M20 20 C30 22 38 30 40 40 C30 38 22 30 20 20 Z" fill="#fde047" fill-opacity="0.2" />
  </g>
  <!-- Category Tag -->
  <g transform="translate(300, 280)">
    <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#4c0519" fill-opacity="0.7" stroke="#fde047" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" fill="#fffbeb" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">MEHNDI &amp; CREATIVE ART</text>
  </g>
</svg>
