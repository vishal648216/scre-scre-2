<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="compostGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="50%" stop-color="#166534" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>
    <radialGradient id="natureGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#bbf7d0" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#bbf7d0" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="350" fill="url(#compostGrad)" />
  <circle cx="300" cy="150" r="130" fill="url(#natureGlow)" />
  <!-- Sprouting Plant & Earth Silhouette -->
  <g fill="#ffffff" opacity="0.9" transform="translate(300, 150) scale(1.15)">
    <!-- Soil mound -->
    <path d="M-60 45 C-40 30 40 30 60 45 C45 58 -45 58 -60 45 Z" fill="#86efac" opacity="0.6" />
    <!-- Stem -->
    <path d="M-2 40 L-2 -20 C-2 -40 2 -40 2 -20 L2 40 Z" fill="#bbf7d0" />
    <!-- Left Leaf -->
    <path d="M-2 -5 C-30 -10 -40 -35 -40 -50 C-20 -50 -5 -30 -2 -5 Z" fill="#4ade80" />
    <path d="M-2 -5 C-15 -20 -25 -32 -38 -45" stroke="#166534" stroke-width="2" fill="none" />
    <!-- Right Leaf -->
    <path d="M2 -25 C30 -30 42 -55 42 -70 C22 -70 5 -50 2 -25 Z" fill="#86efac" />
    <path d="M2 -25 C15 -40 27 -52 40 -65" stroke="#166534" stroke-width="2" fill="none" />
    <!-- Little sprout top -->
    <circle cx="0" cy="-32" r="5" fill="#fef08a" />
  </g>
  <!-- Category Tag -->
  <g transform="translate(300, 280)">
    <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#052e16" fill-opacity="0.65" stroke="#86efac" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" fill="#f0fdf4" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">ORGANIC &amp; FARMING</text>
  </g>
</svg>
