# Apache: proxy /api and /uploads to the Rust backend (fixes 404 on /api/certificates/download/...).
#
# Symptom: Browser Network tab shows GET /api/certificates/download/... → 404 Not Found
# Cause:   DocumentRoot only has the SPA (dist/). Apache never forwards /api/* to the API process.
#
# Enable modules (Debian/Ubuntu):
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo systemctl reload apache2
#
# Put this inside your <VirtualHost *:443> (or :80) for the site that serves the React app.
# Adjust backend port if your API is not on 3008.

    ProxyPreserveHost On
    ProxyRequests Off

    # Rust API (generate-certificates, certificate download, marksheets, auth, …)
    ProxyPass        /api/ http://127.0.0.1:3008/api/
    ProxyPassReverse /api/ http://127.0.0.1:3008/api/

    # Allow large multipart uploads (admin images, documents). Default can be too low and breaks /api/uploads.
    LimitRequestBody 67108864

    # Uploaded files (PDFs, images) served by the same backend
    ProxyPass        /uploads/ http://127.0.0.1:3008/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:3008/uploads/

    # Optional: WebSocket-safe headers if you add WS later
    <Location /api/>
        RequestHeader set X-Forwarded-Proto "https"
    </Location>

# SPA static files stay on DocumentRoot; do NOT put ProxyPass / before /api/ or it will steal all traffic.
