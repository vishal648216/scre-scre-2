# Example: serve Vite `dist/` on Nginx without breaking JS chunks.
# Symptom fixed: vendor-*.js loads as text/html → browser MIME error.
#
# Root cause is usually: (1) try_files sends index.html for missing /assets/*.js
# after deploy, or (2) old index.html cached so hashes point at deleted files.

server {
    listen 443 ssl http2;
    server_name screduc.com www.screduc.com;
    root /var/www/scre/dist;
    index index.html;

    # Hashed assets: never fall through to SPA — return real 404 if file missing (avoids HTML MIME on *.js)
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Required for SPA + Rust API on the same host. Without this, `/api/marksheets` and `/api/generate-certificates`
    # hit the static root and return 404 (browser console: Failed to load resource /api/marksheets).
    location /api/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
