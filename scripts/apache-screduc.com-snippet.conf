# Paste inside <VirtualHost *:443> for screduc.com (HTTPS) — same site serves the Vite SPA from DocumentRoot.
# Enables: POST /api/generate-certificates, GET /api/certificates/download/:id, /uploads, etc.
#
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo systemctl reload apache2
#
# Adjust 3008 if your Rust API listens on another port (check PM2 / systemd).

    ServerName screduc.com
    ServerAlias www.screduc.com

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        /api/ http://127.0.0.1:3008/api/
    ProxyPassReverse /api/ http://127.0.0.1:3008/api/

    ProxyPass        /uploads/ http://127.0.0.1:3008/uploads/
    ProxyPassReverse /uploads/ http://127.0.0.1:3008/uploads/

    <Location /api/>
        RequestHeader set X-Forwarded-Proto "https"
    </Location>
